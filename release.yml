name: Create Foundry Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate module version matches tag
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION="$(jq -r '.version' module.json)"
          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match module.json version ($MANIFEST_VERSION)."
            exit 1
          fi

      - name: Build Foundry module zip
        shell: bash
        run: |
          zip -r end-credits.zip \
            module.json \
            scripts \
            styles \
            README.md \
            CHANGELOG.md \
            LICENSE

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            end-credits.zip
            module.json
